version: 1

root: espalier

ignoreFiles:
  - .gitignore.fixture

ignore:
  # Version control metadata. `.gitignore` never lists `.git/` — git has no need
  # to ignore itself — so this is the one exclusion no other file supplies.
  - .git/
  - .hg/
  - .svn/

  # Repository metadata. Tracked on purpose, and dictated by the tool that reads
  # them rather than by this project's architecture.
  - .gitignore
  - .gitattributes
  - .gitmodules
  - .mailmap
  - .git-blame-ignore-revs
  - .editorconfig
  - .dockerignore
  - .tool-versions

  # Continuous integration.
  - .github/
  - .gitlab/
  - .gitlab-ci.yml
  - .circleci/
  - .buildkite/
  - .travis.yml
  - azure-pipelines.yml
  - Jenkinsfile
  - .drone.yml
  - .woodpecker.yml

  # Licence and legal.
  - LICENSE
  - LICENSE.*
  - LICENCE
  - LICENCE.*
  - COPYING
  - NOTICE
  - AUTHORS
  - CONTRIBUTORS

  # Editor and operating system droppings.
  - .vscode/
  - .idea/
  - .fleet/
  - .zed/
  - "*.swp"
  - .DS_Store
  - Thumbs.db
  - desktop.ini

  # javascript
  # Manifests and lockfiles.
  - package.json
  - package-lock.json
  - npm-shrinkwrap.json
  - yarn.lock
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - bun.lock
  - bun.lockb
  - deno.json
  - deno.jsonc
  - deno.lock

  # Tool configuration. The tool decides the filename; the project only decides
  # the contents.
  - tsconfig.json
  - tsconfig.*.json
  - jsconfig.json
  - .eslintrc
  - .eslintrc.*
  - eslint.config.*
  - .prettierrc
  - .prettierrc.*
  - prettier.config.*
  - .babelrc
  - .babelrc.*
  - babel.config.*
  - .npmrc
  - .nvmrc
  - .node-version

  # espalier governs nothing yet.
  # Remove entries as you bring each area under the espalier — see `espalier adopt`.
  - src/**
  - test/**
  - README.MD
  - main.ts
